<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPIGFIT — Prévia</title><style>
:root{--bg:#090d0b;--panel:#111713;--line:#29352d;--text:#f5f7f5;--muted:#9cab9f;--brand:#b8ff3d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,rgba(184,255,61,.12),transparent 25rem),var(--bg);color:var(--text);font-family:Arial,sans-serif}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:24px 18px;border-right:1px solid var(--line)}.brand{font-size:24px;font-weight:1000;display:flex;gap:10px;align-items:center}.mark{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#090d0b;display:grid;place-items:center}.nav{margin-top:32px;display:grid;gap:8px}.nav button,.switch{padding:13px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;font-weight:800;cursor:pointer}.nav button:hover,.switch{background:var(--panel);border-color:var(--line);color:var(--text)}main{padding:42px;max-width:1300px;width:100%;margin:auto}.eyebrow{color:var(--brand);font-size:12px;font-weight:1000;letter-spacing:1px;text-transform:uppercase}h1{font-size:52px;letter-spacing:-3px;margin:8px 0}.muted{color:var(--muted)}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px}.hero{background:linear-gradient(135deg,#1a281d,#101713)}.bar{height:9px;background:#253027;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--brand);width:25%}.list{display:grid;gap:13px;margin-top:18px}.ex{display:grid;grid-template-columns:55px 1fr auto;gap:15px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:17px}.n{width:55px;height:55px;border-radius:16px;background:#202a22;color:var(--brand);display:grid;place-items:center;font-weight:1000}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--brand);font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.num{font-size:42px;font-weight:1000;margin-top:28px}.hidden{display:none}@media(max-width:800px){.shell{display:block}.side{display:flex;justify-content:space-between;border-right:0;border-bottom:1px solid var(--line)}.nav{margin:0;display:flex}.nav button{font-size:0}.nav button:after{content:'●';font-size:20px}main{padding:22px 15px}h1{font-size:38px}.ex{grid-template-columns:48px 1fr}.ex .btn{grid-column:1/-1}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><span class="mark">F</span>SPIGFIT</div><div class="nav"><button onclick="show('student')">Área do aluno</button><button onclick="show('admin')">Área administrativa</button></div></aside><main><section id="student"><div class="eyebrow">Olá, Marcos</div><h1>Treino de hoje</h1><p class="muted">quinta-feira, 06 de agosto</p><div class="hero"><div class="eyebrow">Treino A · Peito e tríceps</div><h1 id="pct">25% CONCLUÍDO</h1><div class="bar"><div class="fill" id="fill"></div></div></div><div class="list" id="list"></div></section><section id="admin" class="hidden"><div class="eyebrow">Painel administrativo</div><h1>Visão geral</h1><p class="muted">Demonstração com dados fictícios.</p><div class="grid"><div class="stat">Alunos ativos<div class="num">38</div></div><div class="stat">Fichas ativas<div class="num">12</div></div><div class="stat">Programações<div class="num">74</div></div><div class="stat">Exercícios hoje<div class="num">126</div></div></div></section></main></div><script>
const data=['Supino reto','Supino inclinado','Crucifixo no cabo','Tríceps corda'];let done=[0];function render(){list.innerHTML=data.map((x,i)=>`<div class="ex"><div class="n">${done.includes(i)?'✓':i+1}</div><div><b>${x}</b><p class="muted">${i?3:4} séries × ${i===2?15:12} repetições · 60s descanso</p></div><button class="btn" onclick="toggle(${i})">${done.includes(i)?'Reabrir':'Concluir'}</button></div>`).join('');let p=Math.round(done.length/data.length*100);pct.textContent=p+'% CONCLUÍDO';fill.style.width=p+'%'}function toggle(i){done=done.includes(i)?done.filter(x=>x!==i):[...done,i];render()}function show(m){student.classList.toggle('hidden',m!=='student');admin.classList.toggle('hidden',m!=='admin')}render();
</script></body></html>
